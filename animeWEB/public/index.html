<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Enhancer</title>
    <!-- Подключаем стили и скрипты -->
    <link href="https://unpkg.com/dropzone/dist/dropzone.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Video Enhancer</h1>

    <!-- Форма для ввода данных -->
    <form id="title-form">
        <!-- Поля ввода (название, эпизод, хронометраж и т.д.) -->
        <!-- Здесь должны быть ваши элементы формы -->
    </form>

    <div id="container">
        <!-- Dropzone слева -->
        <div id="dropzone-container">
            <!-- Указываем action формы с полным URL сервера -->
            <form action="http://203.0.113.20:54559/upload" class="dropzone disabled" id="video-dropzone"></form>
        </div>

        <!-- Изображение обложки справа -->
        <div id="cover-container">
            <img id="cover-image" src="" alt="Anime Cover">
        </div>
    </div>

    <!-- Кнопка отправки -->
    <button id="submit-btn" disabled>Submit</button>

    <!-- Секция для сообщений -->
    <p id="queue-status"></p>
    <p id="log"></p>
    <p id="error"></p>

    <!-- Подключение скриптов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.7.0/dropzone.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
